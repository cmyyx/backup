# 基本设置
port: 7890 # HTTP代理端口
socks-port: 7891 # SOCKS代理端口
#redir-port: 7892 # 透明代理端口，用于 Linux 和 MacOS
mixed-port: 7893 # HTTP(S) 和 SOCKS 代理混合端口
#tproxy-port: 7894
allow-lan: false # 允许局域网连接
bind-address: "*" # 绑定地址，* 表示所有地址
mode: rule # 代理模式，rule表示规则模式
log-level: info # 日志级别
ipv6: false
#  控制面板
external-controller: 0.0.0.0:9093 # RESTful API 监听地址
# external-controller-tls: 0.0.0.0:9443 # RESTful API HTTPS 监听地址，需要配置 tls 部分配置文件
secret: "cmty-config-lite-for-linux"
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

unified-delay: true # 统一延迟
tcp-concurrent: true # TCP 并发

#  find-process-mode has 3 values:always, strict, off
#  - always, 开启，强制匹配所有进程
#  - strict, 默认，由 mihomo 判断是否开启
#  - off, 不匹配进程，推荐在路由器上使用此模式
find-process-mode: always
global-client-fingerprint: chrome

#  TCP keep alive interval
#  这个选项大概用不到
# disable-keep-alive: false #目前在android端强制为true
# keep-alive-idle: 600
# keep-alive-interval: 15

profile:
  store-selected: true # 存储 select 选择记录
  store-fake-ip: true # 持久化 fake-ip

# 入站  
tun:
  enable: false
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  mtu: 1500 # 最大传输单元,默认 9000
  auto-route: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  prefer-h3: true
  listen: 0.0.0.0:53
  enhanced-mode: redir-host
  cache-algorithm: arc
  use-system-hosts: true
  default-nameserver:
    - "119.29.29.29"
    - "114.114.114.114"
    - "1.1.1.1#节点选择"
    - "8.8.8.8#节点选择"
  nameserver:
    - "tls://dot.pub"
    - "https://doh.pub/dns-query"
    - "1.1.1.1"
  fallback:
    - "1.1.1.1#节点选择"
    - "8.8.8.8#节点选择"
    - "https://8.8.8.8/dns-query#节点选择"
    - "https://1.1.1.1/dns-query#节点选择"
    # https://linux.do/t/topic/920959 佬友自建DOH
    - "https://runtime.webn.cc:2083/dnsgo"
# geodata-mode: true/false
geo-auto-update: true # 是否自动更新 geodata
geo-update-interval: 24 # 更新间隔，单位：小时
geox-url:
  geoip: "https://gh-proxy.com/https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
  geosite: "https://gh-proxy.com/https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"

proxy-groups:
  - name: 订阅信息
    icon: https://testingcf.jsdelivr.net/gh/aihdde/Rules@master/icon/Color/Yin_Yang.png
    type: select
    include-all: true
    filter: "Info-"
  - name: 节点选择
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: select
    proxies:
      - 自动选择
      - 手动切换
  - name: 手动切换
    icon: https://cdn.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/select.png
    include-all: true
    type: select
  - name: 自动选择
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
    type: url-test
    include-all: true
    exclude-filter: (?i)家宽|家庭|商宽|落地|Info-
    interval: 300
    tolerance: 20
    # lazy: false
  - name: 全球直连
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png
    type: select
    proxies:
      - DIRECT
      - 节点选择
  - name: 漏网之鱼
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png
    type: select
    proxies:
      - 全球直连
      - 节点选择
  - name: GLOBAL
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
    include-all: true
    type: select
    proxies:
      - 订阅信息
      - 节点选择
      - 手动切换
      - 全球直连
      - 自动选择

# rule-providers:

rules:
  - "GEOSITE,proxy,节点选择"
  - "GEOSITE,gfw,节点选择"
  - "GEOSITE,CN,全球直连"
  - "GEOSITE,PRIVATE,全球直连"
  - "GEOIP,CN,全球直连,no-resolve"
  - "GEOIP,LAN,全球直连,no-resolve"
  - "GEOIP,PRIVATE,全球直连,no-resolve"
  - "MATCH,漏网之鱼"